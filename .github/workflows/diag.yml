name: diag
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          {
          echo "IP runner: $(curl -s -m 10 https://ifconfig.me) / $(curl -s -m 10 https://ipinfo.io/country)"
          for u in "https://www.zaragoza.es/" "https://www.zaragoza.es/sede/servicio/cultura/evento/list.json?rows=2" "http://www.zaragoza.es/sede/servicio/cultura/evento/list.json?rows=2" "https://zaragoza.es/sede/servicio/cultura/evento/list.json?rows=2"; do
            echo "== $u"; curl -4 -sS -m 40 -o /tmp/o -w "code=%{http_code} t=%{time_total}\n" -A "Mozilla/5.0" "$u" 2>&1; head -c 300 /tmp/o 2>/dev/null; echo
          done
          echo "== DNS"; getent hosts www.zaragoza.es
          } > data/diag.txt 2>&1
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/diag.txt; git commit -m diag; git push
