name: Actualizar agenda de Zaragoza
on:
  schedule:
    - cron: "17 3 * * *"   # cada noche (~05:17 en Zaragoza)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_agenda.py
      - name: Guardar cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Agenda actualizada $(date -u +%F)"
          git push
