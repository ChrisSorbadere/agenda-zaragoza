name: Actualizar agenda de Zaragoza
on:
  schedule:
    - cron: "17 3 * * *"   # cada noche (~05:17 en Zaragoza)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Descargar agenda
        run: python scripts/fetch_agenda.py > data/log.txt 2>&1 || echo "FALLO exit=$?" >> data/log.txt
      - run: cat data/log.txt
      - name: Guardar cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Agenda actualizada $(date -u +%F)"
          git push
